<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lanterna VISTO</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;

  /* 🔥 FORÇA ABSOLUTA DE OCULTAR CURSOR */
  cursor: none !important;
}

* {
  cursor: none !important;
}

#ascii-container {
  position: absolute;
  width: 100%;
  height: 100%;
  color: #00FF41;
  font-size: 14px;
  line-height: 1.4;
  opacity: 0.5;
  word-break: break-all;
  letter-spacing: 0.4em;
  pointer-events: none; /* evita reativação do cursor */
}
</style>
</head>

<body>

<div id="ascii-container"></div>

<script>
const chars = "01VISTO_LAB<>[]{}/\\LUGARzinho//4º Distrito//POA|!@#$%&*+=-_~^";
const container = document.getElementById("ascii-container");

// gerar código
let ascii = "";
for (let i = 0; i < 12000; i++) {
  ascii += chars[Math.floor(Math.random() * chars.length)];
}
container.textContent = ascii;

// posição
let targetX = window.innerWidth / 2;
let targetY = window.innerHeight / 2;

let currentX = targetX;
let currentY = targetY;

const ease = 0.08;

// trail
let trail = [];

// 🔥 captura global (mais forte)
window.addEventListener("mousemove", (e) => {
  targetX = e.clientX;
  targetY = e.clientY;
});

// 🔥 fallback (garante atualização constante)
setInterval(() => {
  // força redraw mesmo sem movimento
}, 16);

function animate() {
  currentX += (targetX - currentX) * ease;
  currentY += (targetY - currentY) * ease;

  trail.push({ x: currentX, y: currentY, life: 1 });

  if (trail.length > 25) {
    trail.shift();
  }

  let gradients = trail.map(p => {
    const alpha = p.life;
    p.life *= 0.93;

    return `radial-gradient(circle 240px at ${p.x}px ${p.y}px,
      rgba(0,0,0,${alpha}) 10%,
      rgba(0,0,0,0.5) 40%,
      rgba(0,0,0,0) 100%)`;
  });

  const mask = gradients.join(",");

  container.style.webkitMaskImage = mask;
  container.style.maskImage = mask;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
